  api-lost:
    build:
      context: .
    container_name: api-lost
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres-api-lost
    environment:
      - DB_NAME=dbLost
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - DB_HOST=postgres-api-lost
      - DB_PORT=5435
      - DEBUG=True

volumes:
  db-data:
  minio-data-lost:
    driver: local